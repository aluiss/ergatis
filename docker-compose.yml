services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ergatis
      POSTGRES_PASSWORD: ergatis
      POSTGRES_DB: ergatis
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ergatis"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
